workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      xcode: latest
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor CLI and iOS
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/ios
      - name: Build web app
        script: npm run build
      - name: Remove and re-add iOS platform
        script: |
          rm -rf ios
          cap add ios
      - name: Set iOS deployment target
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.0'/g" ios/App/Podfile
      - name: Sync Capacitor
        script: cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build iOS
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build
    artifacts:
      - ios/build/**/*.app