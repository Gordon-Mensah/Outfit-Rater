workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      xcode: latest
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor CLI and iOS
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/ios
      - name: Build web app
        script: npm run build
      - name: Remove iOS platform
        script: rm -rf ios
      - name: Add iOS platform
        script: cap add ios || true
      - name: Fix Podfile deployment target
        script: |
          sed -i '' "1s/.*/platform :ios, '16.0'/" ios/App/Podfile
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Sync Capacitor
        script: cap sync ios
      - name: Build iOS
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build
    artifacts:
      - ios/build/**/*.app